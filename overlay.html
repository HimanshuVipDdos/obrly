<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study With Me Overlay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Segoe UI',system-ui,sans-serif;width:1920px;height:1080px;overflow:hidden;position:relative}
#particle-canvas{position:absolute;top:0;left:0;width:1920px;height:1080px;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orbFloat 8s ease-in-out infinite}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(249,115,22,0.18),transparent 70%);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(251,146,60,0.12),transparent 70%);bottom:-80px;right:200px;animation-delay:-3s}
.orb3{width:300px;height:300px;background:radial-gradient(circle,rgba(249,115,22,0.1),transparent 70%);top:300px;right:-80px;animation-delay:-5s}
@keyframes orbFloat{0%,100%{opacity:.6;transform:scale(1) translate(0,0)}33%{opacity:.9;transform:scale(1.08) translate(20px,-15px)}66%{opacity:.5;transform:scale(.95) translate(-10px,20px)}}

/* EDIT PANEL */
#edit-panel{position:fixed;top:0;left:0;right:0;background:rgba(10,15,28,0.97);border-bottom:1px solid rgba(249,115,22,0.3);padding:8px 16px;z-index:9999;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#edit-panel label{font-size:10px;color:#94a3b8;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
#edit-panel input,#edit-panel textarea,#edit-panel select{background:#1e293b;border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;outline:none;font-family:inherit}
.ep-g{display:flex;flex-direction:column;gap:2px}
.ep-r{display:flex;align-items:center;gap:6px}
.btn-obs{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 0 12px rgba(249,115,22,0.4)}
.btn-t{background:#1e293b;color:#22c55e;border:1px solid rgba(34,197,94,0.3);padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
#overlay{position:absolute;top:0;left:0;width:1920px;height:1080px;z-index:1}

/* SESSION BOX */
#left-panel{position:absolute;top:40px;left:40px;width:420px}
.session-box{position:relative;background:rgba(0,0,0,0.72);border-radius:20px;padding:22px 26px;margin-bottom:18px;overflow:hidden;animation:panelIn .8s cubic-bezier(.16,1,.3,1) both}
.session-box::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1.5px;background:linear-gradient(135deg,rgba(249,115,22,0.9),rgba(251,146,60,0.4),rgba(249,115,22,0.1),rgba(251,146,60,0.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borderRotate 4s linear infinite}
.session-box::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(249,115,22,0.06),transparent);animation:shimmer 3s ease-in-out infinite 1s}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}
@keyframes borderRotate{0%{background:linear-gradient(135deg,rgba(249,115,22,0.9),rgba(251,146,60,0.3),rgba(249,115,22,0.1),rgba(251,146,60,0.6))}50%{background:linear-gradient(315deg,rgba(249,115,22,0.9),rgba(251,146,60,0.3),rgba(249,115,22,0.1),rgba(251,146,60,0.6))}100%{background:linear-gradient(495deg,rgba(249,115,22,0.9),rgba(251,146,60,0.3),rgba(249,115,22,0.1),rgba(251,146,60,0.6))}}
@keyframes panelIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.session-label{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#f97316;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;background:#ef4444;border-radius:50%;box-shadow:0 0 8px #ef4444,0 0 16px rgba(239,68,68,0.5);animation:livePulse 1.2s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 8px #ef4444,0 0 16px rgba(239,68,68,.5)}50%{opacity:.3;box-shadow:0 0 4px #ef4444}}
.student-name{font-size:12px;color:#f97316;margin-bottom:5px;font-weight:600;letter-spacing:.5px;opacity:.8}
.session-name{font-size:24px;font-weight:900;color:#fff;line-height:1.2;word-break:break-word;text-shadow:0 0 30px rgba(249,115,22,0.3)}

/* TIMER BOX */
.timer-box{position:relative;background:rgba(0,0,0,0.72);border-radius:20px;padding:20px 26px;text-align:center;overflow:hidden;animation:panelIn .8s cubic-bezier(.16,1,.3,1) .15s both;transition:all .5s}
.timer-box::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1.5px;background:linear-gradient(135deg,rgba(34,197,94,0.8),rgba(16,185,129,0.3),rgba(34,197,94,0.1),rgba(16,185,129,0.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borderRotateG 4s linear infinite;transition:all .5s}
@keyframes borderRotateG{0%{background:linear-gradient(135deg,rgba(34,197,94,0.8),rgba(16,185,129,0.2),rgba(34,197,94,0.1),rgba(16,185,129,0.5))}50%{background:linear-gradient(315deg,rgba(34,197,94,0.8),rgba(16,185,129,0.2),rgba(34,197,94,0.1),rgba(16,185,129,0.5))}100%{background:linear-gradient(495deg,rgba(34,197,94,0.8),rgba(16,185,129,0.2),rgba(34,197,94,0.1),rgba(16,185,129,0.5))}}
@keyframes borderRotateB2{0%{background:linear-gradient(135deg,rgba(56,189,248,0.8),rgba(99,102,241,0.2),rgba(56,189,248,0.1),rgba(99,102,241,0.5))}50%{background:linear-gradient(315deg,rgba(56,189,248,0.8),rgba(99,102,241,0.2),rgba(56,189,248,0.1),rgba(99,102,241,0.5))}100%{background:linear-gradient(495deg,rgba(56,189,248,0.8),rgba(99,102,241,0.2),rgba(56,189,248,0.1),rgba(99,102,241,0.5))}}

/* BREAK MODE TIMER */
.timer-box.break-mode::before{animation:borderRotateB2 4s linear infinite}
.timer-label{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#22c55e;margin-bottom:8px;text-shadow:0 0 10px rgba(34,197,94,0.5);transition:color .4s}
.timer-box.break-mode .timer-label{color:#38bdf8;text-shadow:0 0 10px rgba(56,189,248,0.5)}
.timer-display{font-size:58px;font-weight:900;color:#fff;letter-spacing:5px;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 20px rgba(34,197,94,0.4),0 0 40px rgba(34,197,94,0.15);transition:text-shadow .4s}
.timer-box.break-mode .timer-display{text-shadow:0 0 20px rgba(56,189,248,0.4),0 0 40px rgba(56,189,248,0.15)}
.timer-display.paused{color:#475569;text-shadow:none}
.timer-mode-label{font-size:10px;color:#475569;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}

/* SESSION COUNTER */
.session-counter{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.session-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.15);transition:all .4s}
.session-dot.done{background:#22c55e;border-color:#22c55e;box-shadow:0 0 6px rgba(34,197,94,0.6)}
.session-dot.active{background:#f97316;border-color:#f97316;box-shadow:0 0 8px rgba(249,115,22,0.7);animation:dotPulse 1s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* STATUS BADGE */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:6px;transition:all .4s}
.status-badge.focus{background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.4);color:#f97316}
.status-badge.break{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:#38bdf8}

/* RIGHT PANEL */
#right-panel{position:absolute;top:40px;right:40px;width:390px;animation:panelInR .8s cubic-bezier(.16,1,.3,1) .3s both}
@keyframes panelInR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.tasks-box{position:relative;background:rgba(0,0,0,0.72);border-radius:20px;padding:22px 26px;overflow:hidden}
.tasks-box::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1.5px;background:linear-gradient(135deg,rgba(56,189,248,0.8),rgba(99,102,241,0.3),rgba(56,189,248,0.1),rgba(99,102,241,0.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borderRotateB 4s linear infinite}
@keyframes borderRotateB{0%{background:linear-gradient(135deg,rgba(56,189,248,0.8),rgba(99,102,241,0.2),rgba(56,189,248,0.1),rgba(99,102,241,0.5))}50%{background:linear-gradient(315deg,rgba(56,189,248,0.8),rgba(99,102,241,0.2),rgba(56,189,248,0.1),rgba(99,102,241,0.5))}100%{background:linear-gradient(495deg,rgba(56,189,248,0.8),rgba(99,102,241,0.2),rgba(56,189,248,0.1),rgba(99,102,241,0.5))}}
.tasks-box::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(56,189,248,0.04),transparent);animation:shimmer 4s ease-in-out infinite 2s}
.tasks-header{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#38bdf8;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;text-shadow:0 0 10px rgba(56,189,248,0.4)}
.tasks-count{font-size:11px;color:#334155;font-weight:600;letter-spacing:0}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:all .2s;border-radius:4px}
.task-item:last-child{border-bottom:none}
.task-item:hover{background:rgba(255,255,255,0.02);padding-left:4px}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .3s}
.task-item.done .task-check{background:#22c55e;border-color:#22c55e;color:#fff;box-shadow:0 0 10px rgba(34,197,94,0.5)}
.task-text{font-size:14px;color:#cbd5e1;line-height:1.45;font-weight:500;transition:all .25s}
.task-item.done .task-text{text-decoration:line-through;color:#334155}

/* BOTTOM */
#bottom-bar{position:absolute;bottom:30px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between;animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.brand-tag{position:relative;background:rgba(0,0,0,0.75);border-radius:100px;padding:10px 24px;font-size:14px;font-weight:800;color:#f97316;letter-spacing:.8px;overflow:hidden}
.brand-tag::before{content:'';position:absolute;inset:0;border-radius:100px;padding:1.5px;background:linear-gradient(90deg,rgba(249,115,22,0.8),rgba(251,146,60,0.3),rgba(249,115,22,0.8));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borderRotate 3s linear infinite}
.brand-tag::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(249,115,22,0.15),transparent);animation:shimmer 2.5s ease-in-out infinite}
.focus-tag{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:100px;padding:10px 20px;font-size:12px;color:#475569;font-weight:600;letter-spacing:.5px;transition:all .4s}

/* FLASH OVERLAY */
#flash{position:fixed;inset:0;background:rgba(249,115,22,0.15);opacity:0;pointer-events:none;z-index:9998;transition:opacity .3s}
#flash.break-flash{background:rgba(56,189,248,0.15)}
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div id="flash"></div>

<!-- EDIT PANEL -->
<div id="edit-panel">
  <div class="ep-g"><label>Session</label><input type="text" id="inp-session" style="width:190px" oninput="document.getElementById('session-name').textContent=this.value"></div>
  <div class="ep-g"><label>Naam</label><input type="text" id="inp-name" style="width:120px" oninput="setStudentName(this.value)"></div>
  <div class="ep-g"><label>Brand</label><input type="text" id="inp-brand" style="width:140px" oninput="document.getElementById('brand-tag-text').textContent=this.value"></div>
  <div class="ep-g"><label>Tasks</label><textarea id="inp-tasks" rows="3" style="width:220px;resize:none" oninput="updateTasks(this.value)"></textarea></div>
  <div class="ep-g"><label>Mode</label>
    <div class="ep-r">
      <select id="timer-mode" onchange="setMode()" style="background:#1e293b;color:#fff;border:1px solid rgba(255,255,255,0.1);padding:5px 7px;border-radius:6px;font-size:11px">
        <option value="stopwatch">Stopwatch</option>
        <option value="25">Pomodoro 25+5</option>
        <option value="50">Focus 50+10</option>
        <option value="90">Session 90+15</option>
      </select>
    </div>
  </div>
  <div class="ep-g"><label>Timer</label>
    <div class="ep-r">
      <button class="btn-t" id="btn-ss" onclick="startStop()">▶ Start</button>
      <button class="btn-t" onclick="resetAll()">↺ Reset</button>
      <button class="btn-t" onclick="skipPhase()" style="color:#f97316;border-color:rgba(249,115,22,0.3)">⏭ Skip</button>
    </div>
  </div>
  <button class="btn-obs" onclick="document.getElementById('edit-panel').classList.toggle('hidden')">🎬 OBS Mode</button>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <div id="left-panel">
    <div class="session-box">
      <div class="session-label"><div class="live-dot"></div>Live Session</div>
      <div class="student-name" id="student-name"></div>
      <div class="session-name" id="session-name">Study With Me</div>
    </div>

    <div class="timer-box" id="timer-box">
      <div class="status-badge focus" id="status-badge">🔥 FOCUS TIME</div>
      <div class="timer-label" id="timer-label">SESSION 1 OF 4</div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-mode-label" id="timer-mode-label">STOPWATCH</div>
      <div class="session-counter" id="session-counter"></div>
    </div>
  </div>

  <div id="right-panel">
    <div class="tasks-box">
      <div class="tasks-header">📋 Today's Tasks<span class="tasks-count" id="tasks-count">0 / 0</span></div>
      <div id="task-list"></div>
    </div>
  </div>

  <div id="bottom-bar">
    <div class="brand-tag"><span id="brand-tag-text">Sarvodaya Adhyeta</span></div>
    <div class="focus-tag" id="focus-tag">Focus Mode · Stay Consistent 🔥</div>
  </div>
</div>

<script>
// ── PARTICLES ──
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1920; canvas.height = 1080;
const COLORS = ['rgba(249,115,22,','rgba(251,146,60,','rgba(234,88,12,','rgba(255,255,255,'];
class Particle {
  constructor(){this.reset()}
  reset(){this.x=Math.random()*1920;this.y=Math.random()*1080;this.size=Math.random()*2.5+0.3;this.speedX=(Math.random()-.5)*.4;this.speedY=-Math.random()*.6-.1;this.opacity=Math.random()*.6+.1;this.color=COLORS[Math.floor(Math.random()*COLORS.length)];this.twinkle=Math.random()*Math.PI*2;this.twinkleSpeed=Math.random()*.03+.01}
  update(){this.x+=this.speedX;this.y+=this.speedY;this.twinkle+=this.twinkleSpeed;this.opacity=.2+Math.sin(this.twinkle)*.3;if(this.y<-10||this.x<-10||this.x>1930)this.reset()}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.opacity);ctx.fillStyle=this.color+this.opacity+')';ctx.shadowColor=this.color+'0.8)';ctx.shadowBlur=this.size*3;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
class FloatShape {
  constructor(){this.reset()}
  reset(){this.x=Math.random()*1920;this.y=1080+20;this.size=Math.random()*8+3;this.speedY=-Math.random()*.4-.15;this.speedX=(Math.random()-.5)*.2;this.opacity=0;this.maxOpacity=Math.random()*.2+.04;this.rotation=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-.5)*.02;this.type=Math.floor(Math.random()*3);this.color=Math.random()>.5?'rgba(249,115,22,':'rgba(255,255,255,'}
  update(){this.y+=this.speedY;this.x+=this.speedX;this.rotation+=this.rotSpeed;if(this.y>900)this.opacity=Math.min(this.maxOpacity,this.opacity+.002);else this.opacity=Math.max(0,this.opacity-.001);if(this.y<-30)this.reset()}
  draw(){ctx.save();ctx.globalAlpha=this.opacity;ctx.strokeStyle=this.color+this.opacity*2+')';ctx.lineWidth=1;ctx.translate(this.x,this.y);ctx.rotate(this.rotation);ctx.beginPath();if(this.type===0){ctx.rect(-this.size/2,-this.size/2,this.size,this.size)}else if(this.type===1){ctx.moveTo(0,-this.size);ctx.lineTo(this.size,this.size);ctx.lineTo(-this.size,this.size);ctx.closePath()}else{for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;i===0?ctx.moveTo(Math.cos(a)*this.size,Math.sin(a)*this.size):ctx.lineTo(Math.cos(a)*this.size,Math.sin(a)*this.size)}ctx.closePath()}ctx.stroke();ctx.restore()}
}
const PARTICLES=[];for(let i=0;i<180;i++){const p=new Particle();p.y=Math.random()*1080;PARTICLES.push(p)}
const SHAPES=[];for(let i=0;i<25;i++){const s=new FloatShape();s.y=Math.random()*1080;SHAPES.push(s)}
function animateParticles(){ctx.clearRect(0,0,1920,1080);PARTICLES.forEach(p=>{p.update();p.draw()});SHAPES.forEach(s=>{s.update();s.draw()});requestAnimationFrame(animateParticles)}
animateParticles();

// ── URL PARAMS ──
const params = new URLSearchParams(window.location.search);
const pName    = params.get('name')    || '';
const pSession = params.get('session') || 'Study With Me';
const pBrand   = params.get('brand')   || 'Sarvodaya Adhyeta';
const pTimer   = params.get('timer')   || 'stopwatch';
const pTasks   = params.get('tasks')   || '';

document.getElementById('inp-session').value = pSession;
document.getElementById('inp-name').value    = pName;
document.getElementById('inp-brand').value   = pBrand;
document.getElementById('inp-tasks').value   = pTasks;
document.getElementById('session-name').textContent = pSession;
document.getElementById('brand-tag-text').textContent = pBrand;
if(pName) document.getElementById('student-name').textContent = pName + ' ka session';

const tmSel = document.getElementById('timer-mode');
for(let i=0;i<tmSel.options.length;i++){if(tmSel.options[i].value===pTimer){tmSel.selectedIndex=i;break}}

function setStudentName(v){document.getElementById('student-name').textContent=v?v+' ka session':''}

// ── TASKS ──
let tasks=[];
function updateTasks(val){
  const lines=val.split('\n').map(l=>l.trim()).filter(l=>l);
  const prev=tasks.map(t=>t.done);
  tasks=lines.map((text,i)=>({text,done:prev[i]||false}));
  renderTasks();
}
function renderTasks(){
  const list=document.getElementById('task-list');
  list.innerHTML='';
  tasks.forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='task-item'+(t.done?' done':'');
    div.onclick=()=>{tasks[i].done=!tasks[i].done;renderTasks()};
    div.innerHTML=`<div class="task-check">${t.done?'✓':''}</div><div class="task-text">${t.text}</div>`;
    list.appendChild(div);
  });
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('tasks-count').textContent=done+' / '+tasks.length;
}
updateTasks(pTasks);

// ── POMODORO TIMER ENGINE ──
const BREAK_TIMES = { stopwatch:0, '25':5, '50':10, '90':15 };
const FOCUS_TIMES = { stopwatch:0, '25':25, '50':50, '90':90 };
const TOTAL_SESSIONS = 4;

let timerInterval = null;
let seconds       = 0;
let running       = false;
let isBreak       = false;
let sessionNum    = 1;
let focusMins     = 0;
let breakMins     = 0;
let isStopwatch   = true;

function pad(n){return String(n).padStart(2,'0')}
function fmt(s){return pad(Math.floor(s/3600))+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60)}

function setMode(){
  resetAll();
  const mode = document.getElementById('timer-mode').value;
  focusMins  = FOCUS_TIMES[mode];
  breakMins  = BREAK_TIMES[mode];
  isStopwatch = (mode === 'stopwatch');
  if(isStopwatch){
    document.getElementById('timer-mode-label').textContent = 'STOPWATCH';
    document.getElementById('focus-tag').textContent = 'Focus Mode · Stay Consistent 🔥';
    document.getElementById('timer-label').textContent = 'RUNNING TIME';
    document.getElementById('timer-display').textContent = '00:00:00';
    document.getElementById('session-counter').innerHTML = '';
    setFocusUI();
  } else {
    seconds = focusMins * 60;
    document.getElementById('timer-display').textContent = fmt(seconds);
    document.getElementById('timer-mode-label').textContent = focusMins + ' MIN FOCUS · ' + breakMins + ' MIN BREAK';
    document.getElementById('focus-tag').textContent = 'Pomodoro · ' + focusMins + '+' + breakMins + ' min cycle';
    renderSessionDots();
    setFocusUI();
    updateTimerLabel();
  }
}

function renderSessionDots(){
  const el = document.getElementById('session-counter');
  el.innerHTML = '';
  for(let i=1;i<=TOTAL_SESSIONS;i++){
    const d = document.createElement('div');
    d.className = 'session-dot' + (i < sessionNum ? ' done' : i === sessionNum ? ' active' : '');
    el.appendChild(d);
  }
}

function updateTimerLabel(){
  if(isStopwatch) return;
  if(isBreak){
    document.getElementById('timer-label').textContent = '☕ BREAK · SESSION ' + sessionNum + ' OF ' + TOTAL_SESSIONS;
  } else {
    document.getElementById('timer-label').textContent = '🔥 SESSION ' + sessionNum + ' OF ' + TOTAL_SESSIONS;
  }
}

function setFocusUI(){
  const box = document.getElementById('timer-box');
  const badge = document.getElementById('status-badge');
  const label = document.getElementById('timer-label');
  const ftag  = document.getElementById('focus-tag');
  box.classList.remove('break-mode');
  badge.className = 'status-badge focus';
  badge.textContent = '🔥 FOCUS TIME';
  if(!isStopwatch) ftag.textContent = 'Pomodoro · ' + focusMins + '+' + breakMins + ' min cycle';
}

function setBreakUI(){
  const box = document.getElementById('timer-box');
  const badge = document.getElementById('status-badge');
  document.getElementById('focus-tag').textContent = '☕ Break Time — Relax karo!';
  box.classList.add('break-mode');
  badge.className = 'status-badge break';
  badge.textContent = '☕ BREAK TIME';
}

function flashScreen(type){
  const f = document.getElementById('flash');
  f.className = type === 'break' ? 'break-flash' : '';
  f.style.opacity = '1';
  setTimeout(()=>f.style.opacity='0', 600);
}

function phaseComplete(){
  clearInterval(timerInterval);
  running = false;
  document.getElementById('btn-ss').textContent = '▶ Start';

  if(isStopwatch) return;

  if(!isBreak){
    // Focus done → start break
    flashScreen('break');
    isBreak = true;
    seconds = breakMins * 60;
    document.getElementById('timer-display').textContent = fmt(seconds);
    setBreakUI();
    updateTimerLabel();
    renderSessionDots();
    // auto start break
    startStop();
  } else {
    // Break done → next focus session
    flashScreen('focus');
    isBreak = false;
    if(sessionNum < TOTAL_SESSIONS){
      sessionNum++;
    } else {
      sessionNum = 1; // cycle restart
    }
    seconds = focusMins * 60;
    document.getElementById('timer-display').textContent = fmt(seconds);
    setFocusUI();
    updateTimerLabel();
    renderSessionDots();
    // auto start next focus
    startStop();
  }
}

function startStop(){
  if(running){
    clearInterval(timerInterval);
    running = false;
    document.getElementById('timer-display').classList.add('paused');
    document.getElementById('btn-ss').textContent = '▶ Start';
  } else {
    running = true;
    document.getElementById('timer-display').classList.remove('paused');
    document.getElementById('btn-ss').textContent = '⏸ Pause';
    timerInterval = setInterval(()=>{
      if(isStopwatch){
        seconds++;
        document.getElementById('timer-display').textContent = fmt(seconds);
      } else {
        if(seconds > 0){
          seconds--;
          document.getElementById('timer-display').textContent = fmt(seconds);
        } else {
          phaseComplete();
        }
      }
    },1000);
  }
}

function skipPhase(){
  clearInterval(timerInterval);
  running = false;
  document.getElementById('btn-ss').textContent = '▶ Start';
  seconds = 0;
  phaseComplete();
}

function resetAll(){
  clearInterval(timerInterval);
  running = false;
  isBreak = false;
  sessionNum = 1;
  seconds = 0;
  document.getElementById('btn-ss').textContent = '▶ Start';
  document.getElementById('timer-display').classList.remove('paused');
  document.getElementById('timer-display').textContent = '00:00:00';
  setFocusUI();
  if(!isStopwatch){
    seconds = focusMins * 60;
    document.getElementById('timer-display').textContent = fmt(seconds);
    updateTimerLabel();
    renderSessionDots();
  }
}

// init
setMode();
</script>
</body>
</html>
